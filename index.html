<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Clone</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 120px;
            background-color: white;
        }

        h1{
            font-size: 70px;
            margin-bottom: 20px;
        }

        .blue{ color:#4285F4; }
        .red{ color:#EA4335; }
        .yellow{ color:#FBBC05; }
        .green{ color:#34A853; }

        input{
            width: 500px;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button{
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background-color: #f2f2f2;
            cursor: pointer;
            font-size: 15px;
            border-radius: 5px;
        }

        button:hover{
            background-color: #ddd;
        }

        .info{
            margin-top: 50px;
            font-size: 18px;
            color: #555;
            line-height: 1.8;
        }

        .contact{
            margin-top: 15px;
            font-size: 18px;
            color: #222;
        }
    </style>
</head>
<body>

    <!-- Google Style Logo -->
    <h1>
        <span class="blue">G</span>
        <span class="red">o</span>
        <span class="yellow">o</span>
        <span class="blue">g</span>
        <span class="green">l</span>
        <span class="red">e</span>
    </h1>

    <!-- Search Box -->
    <input type="text" placeholder="Search Google or type a URL">

    <br>

    <!-- Buttons -->
    <button>Google Search</button>
    <button>I'm Feeling Lucky</button>

    <!-- Your Information -->
    <div class="info">
        <p><b>Name:</b> Chaudhary Nabin</p>
        <p><b>ID:</b> 2417124</p>

        <!-- Contact Section -->
        <div class="contact">
            <p><b>Contact:</b> +82-010-1234-5678</p>
        </div>
    </div>

</body>
</html>
